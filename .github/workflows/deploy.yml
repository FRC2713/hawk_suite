name: Deploy

on:
  # Deploys happen only when someone runs this workflow from main; merging never
  # deploys. The production environment has no required reviewers, so a run
  # goes straight through: starting it is the decision to deploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        name: Pin protected main and show the proposed release
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/heads/main ]] || { echo 'Deploy must run from main'; exit 1; }
          python3 scripts/release.py --require-ready --require-authentication
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Proposed suite revision: $GITHUB_SHA"
            echo '```json'
            cat releases/production.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: plan
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.revision }}
      - name: Deploy approved revision
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

          # Non-secret settings live as repository variables so they are
          # readable and diffable; only credentials are secrets.
          DOMAIN: ${{ vars.DOMAIN }}
          LOG_MODE: ${{ vars.LOG_MODE || 'full' }}
          TZ: ${{ vars.TZ || 'America/New_York' }}
          # hawk-mod's lifecycle sync. Optional: unset, hawk-mod runs as before
          # and /hawkmod lifecycle says Google is not configured.
          LIFECYCLE_SHEET_ID: ${{ vars.LIFECYCLE_SHEET_ID }}
          # hawk-shop's Onshape API key. Optional: unset, CAD features return
          # 409 and the rest of Shop works. The base URL defaults in Compose.
          ONSHAPE_BASE_URL: ${{ vars.ONSHAPE_BASE_URL }}
          ONSHAPE_WEBHOOK_BASE_URL: ${{ vars.ONSHAPE_WEBHOOK_BASE_URL }}
          ONSHAPE_WEBHOOK_SECRET: ${{ secrets.ONSHAPE_WEBHOOK_SECRET }}

          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
          # hawk-shop's Slack bot (status notifications and problem reports).
          # Optional: unset, Shop works and its Slack page says not configured.
          HAWK_SHOP_SLACK_BOT_TOKEN: ${{ secrets.HAWK_SHOP_SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_STATE_SECRET: ${{ secrets.SLACK_STATE_SECRET }}
          ALERT_CHANNEL_ID: ${{ secrets.ALERT_CHANNEL_ID }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          # A different service account from hawk-bot's: this one can read the
          # lifecycle sheet, which names every student. Never cross the two.
          HAWK_MOD_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.HAWK_MOD_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}

          # hawk-bot's Slack app is a separate one from hawk-mod's, so these
          # are separate secrets. Crossing them would have hawk-bot answering
          # as the wrong app, which presents as Slack ignoring it.
          HAWK_BOT_SLACK_SIGNING_SECRET: ${{ secrets.HAWK_BOT_SLACK_SIGNING_SECRET }}
          HAWK_BOT_SLACK_CLIENT_ID: ${{ secrets.HAWK_BOT_SLACK_CLIENT_ID }}
          HAWK_BOT_SLACK_CLIENT_SECRET: ${{ secrets.HAWK_BOT_SLACK_CLIENT_SECRET }}
          HAWK_BOT_SLACK_STATE_SECRET: ${{ secrets.HAWK_BOT_SLACK_STATE_SECRET }}
          HAWK_BOT_TOKEN_ENCRYPTION_KEY: ${{ secrets.HAWK_BOT_TOKEN_ENCRYPTION_KEY }}
          HAWK_BOT_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.HAWK_BOT_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
          MANAGED_USERGROUPS: ${{ vars.MANAGED_USERGROUPS }}
          REPORT_TIME: ${{ vars.REPORT_TIME }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SUITE_SHA: ${{ needs.plan.outputs.revision }}
          HAWK_EYE_TBA_API_KEY: ${{ secrets.HAWK_EYE_TBA_API_KEY }}
          HAWK_EYE_MATCH13_API_KEY: ${{ secrets.HAWK_EYE_MATCH13_API_KEY }}
          HAWK_EYE_MATCH13_ACCOUNT: ${{ vars.HAWK_EYE_MATCH13_ACCOUNT || 'default' }}
          HAWK_AUTH_SLACK_CLIENT_ID: ${{ vars.HAWK_AUTH_SLACK_CLIENT_ID }}
          HAWK_AUTH_SLACK_TEAM_ID: ${{ vars.HAWK_AUTH_SLACK_TEAM_ID }}
          HAWK_AUTH_SLACK_CLIENT_SECRET: ${{ secrets.HAWK_AUTH_SLACK_CLIENT_SECRET }}
          HAWK_AUTH_SIGNING_KEY_BASE64: ${{ secrets.HAWK_AUTH_SIGNING_KEY_BASE64 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/send-deploy.sh
      - name: Deployment receipt
        if: always()
        run: |
          if [ -f receipt.txt ]; then
            grep '^HAWK_RECEIPT=' receipt.txt | cut -d= -f2- | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo 'If apply failed, inspect the retained failed-release record and encrypted backup before attempting schema recovery.' >> "$GITHUB_STEP_SUMMARY"
