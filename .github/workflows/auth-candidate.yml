name: Authentication candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested images to GHCR (does not deploy or promote)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the exact native candidate
        run: |
          python3 scripts/build-authentication.py
          python3 scripts/test-authentication.py
          python3 -m pip install cryptography==46.0.4
          python3 scripts/test-auth-routing.py
      - name: Export the tested image
        if: inputs.publish
        run: docker save hawk-auth-candidate:local -o candidate.tar
      - uses: actions/upload-artifact@v4
        with:
          name: auth-${{ matrix.arch }}
          retention-days: 7
          path: |
            candidate.tar
            test/authentication/candidate.json
            test/authentication/results.json

  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: auth-*
          path: candidates
      - uses: docker/setup-buildx-action@v3
      - name: Publish only the already-tested images
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/${REPOSITORY_OWNER,,}/hawk-auth"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for arch in amd64 arm64; do
            docker load -i "candidates/auth-$arch/candidate.tar"
            docker tag hawk-auth-candidate:local "$image:$tag-$arch"
            docker push "$image:$tag-$arch"
          done
          docker buildx imagetools create -t "$image:$tag" "$image:$tag-amd64" "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag" > auth-image.txt
          {
            echo '## Tested authentication candidate (not deployed)'
            echo "Suite source: $GITHUB_SHA"
            echo '```text'
            cat auth-image.txt
            echo '```'
            echo 'Review and pin the index digest in a separate release change.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: authentication-published-identity
          path: auth-image.txt
