name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse and lint clean
        run: |
          shellcheck setup.sh update.sh scripts/hawk-deploy scripts/provision-host.sh

      - name: Compose file resolves with a filled-in environment
        run: |
          cat > .env <<'EOF'
          DOMAIN=ci.example.org
          ONSHAPE_CLIENT_ID=ci
          ONSHAPE_CLIENT_SECRET=ci
          SLACK_SIGNING_SECRET=ci
          SLACK_CLIENT_ID=ci
          SLACK_CLIENT_SECRET=ci
          SLACK_STATE_SECRET=ci
          ALERT_CHANNEL_ID=C0000000000
          TOKEN_ENCRYPTION_KEY=ci
          EOF
          docker compose config > /tmp/resolved.yml
          # The derived URLs are the thing most likely to break silently.
          grep -q 'APP_URL: https://shop.ci.example.org' /tmp/resolved.yml
          grep -q 'PUBLIC_URL: https://mod.ci.example.org' /tmp/resolved.yml
          grep -q 'ONSHAPE_REDIRECT_URI: https://shop.ci.example.org/auth/onshape/callback' /tmp/resolved.yml

      - name: A blank DOMAIN is refused
        run: |
          printf 'DOMAIN=\n' > .env
          if docker compose config >/dev/null 2>&1; then
            echo "compose accepted a blank DOMAIN — the guard in docker-compose.yml is gone"
            exit 1
          fi

      - name: cloud-init.yaml is valid YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('cloud-init.yaml'))"

      - name: hawk-deploy refuses a bad environment
        run: |
          T=$(mktemp -d)
          run() { STACK_DIR="$T" bash scripts/hawk-deploy 2>&1 || true; }

          # A blank or missing credential must never reach .env — the stack
          # would come up crash-looping and read as an unrelated outage.
          printf 'DOMAIN=x.org\n' | run | grep -q 'no TOKEN_ENCRYPTION_KEY'
          printf 'TOKEN_ENCRYPTION_KEY=k\n' | run | grep -q 'no DOMAIN'

          # Changing TOKEN_ENCRYPTION_KEY forces every adult to re-authorize
          # and orphans stored tokens. It must never happen via a deploy.
          printf 'DOMAIN=x.org\nTOKEN_ENCRYPTION_KEY=ORIGINAL\n' > "$T/.env"
          printf 'DOMAIN=x.org\nTOKEN_ENCRYPTION_KEY=CHANGED\n' | run \
            | grep -q 'differs from the one on this host'
          grep -q 'TOKEN_ENCRYPTION_KEY=ORIGINAL' "$T/.env"

      - name: Every variable setup.sh writes is documented in .env.example
        run: |
          missing=0
          # Variable names on the left of '=' inside setup.sh's heredoc.
          for var in $(sed -n '/^cat > .env <<EOF$/,/^EOF$/p' setup.sh \
                       | grep -oE '^[A-Z_]+=' | tr -d '='); do
            grep -qE "^#? *${var}=" .env.example || { echo "undocumented: $var"; missing=1; }
          done
          exit $missing
