name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell and deployment transaction checks
        run: |
          shellcheck setup.sh update.sh scripts/send-deploy.sh scripts/verify-https.sh scripts/provision-host.sh scripts/test-hawk-eye-routing.sh
          python3 -m unittest discover -s test -v
          python3 scripts/release.py --env > /tmp/release.env
      - name: Validate resolved configuration and credential separation
        run: |
          cat > /tmp/fixture.env <<'EOF'
          DOMAIN=ci.example.org
          SLACK_SIGNING_SECRET=mod-secret
          TOKEN_ENCRYPTION_KEY=mod-key
          HAWK_BOT_SLACK_SIGNING_SECRET=bot-secret
          HAWK_BOT_TOKEN_ENCRYPTION_KEY=bot-key
          HAWK_BOT_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64=bot-google
          HAWK_MOD_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64=mod-google
          LIFECYCLE_SHEET_ID=ci-sheet
          REPORT_TIME=09:15
          MANAGED_USERGROUPS=S12345
          HAWK_EYE_TBA_API_KEY=ci-tba
          HAWK_EYE_MATCH13_API_KEY=ci-match13
          HAWK_EYE_MATCH13_ACCOUNT=ci-account
          EOF
          docker compose --env-file /tmp/fixture.env --env-file /tmp/release.env config --format json > /tmp/resolved.json
          python3 test/check_compose.py /tmp/resolved.json
          if DOMAIN='' docker compose config >/dev/null 2>&1; then
            echo 'Blank DOMAIN accepted'; exit 1
          fi
      - name: Validate Caddy and cloud-init
        run: |
          python3 -c "import yaml; yaml.safe_load(open('cloud-init.yaml'))"
          docker run --rm -e DOMAIN=ci.example.org -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify Hawk Eye read-only public routing
        run: bash scripts/test-hawk-eye-routing.sh
      - name: Authenticate to private suite container packages
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Exercise encrypted backup and recovery with disposable volumes
        run: python3 test/backup-integration.py
