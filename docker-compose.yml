name: hawk-suite

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env — see .env.example}
      # Caddy parses the Caddyfile once, at startup. The file is bind-mounted,
      # so editing it does not change this container's spec and `up -d` has no
      # reason to recreate it — routing changes deploy green and do nothing.
      # hawk-deploy reloads the config explicitly, but only from the version
      # installed on the host; bump this when changing the Caddyfile to force a
      # recreate regardless of which hawk-deploy the host is running.
      CADDY_CONFIG_REV: "9"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - caddy_data:/data
      - caddy_config:/config
    # Start order only, deliberately not `condition: service_healthy`: an app
    # missing a credential should not keep the proxy (and the other app) down.
    networks: [shop, mod, bot, eye]
    depends_on:
      - hawk-shop
      - hawk-mod
      - hawk-bot
      - hawk-eye

  hawk-shop:
    networks: [shop]
    image: ${HAWK_SHOP_IMAGE:-ghcr.io/frc2713/hawk-shop:${HAWK_SHOP_TAG:-latest}}
    restart: unless-stopped
    environment:
      # --- Onshape API key (optional) ------------------------------------
      # A server-side key pair from https://dev-portal.onshape.com/keys.
      # Unset, CAD import and part-number writes return 409 and the rest of
      # Shop works. Sign-in is Hawk Suite's; the authentication overlay
      # supplies HAWK_SUITE_* only behind the gateway that sets those headers.
      ONSHAPE_ACCESS_KEY: ${ONSHAPE_ACCESS_KEY:-}
      ONSHAPE_SECRET_KEY: ${ONSHAPE_SECRET_KEY:-}
      ONSHAPE_BASE_URL: ${ONSHAPE_BASE_URL:-https://cad.onshape.com}
      ONSHAPE_WEBHOOK_SECRET: ${ONSHAPE_WEBHOOK_SECRET:-}
      ONSHAPE_WEBHOOK_BASE_URL: ${ONSHAPE_WEBHOOK_BASE_URL:-}

      # --- Slack bot (optional) -------------------------------------------
      # Bot token for Shop's own Slack app, separate from hawk-mod's and
      # hawk-bot's. The workspace defaults to HAWK_SUITE_TEAM_ID.
      SLACK_BOT_TOKEN: ${HAWK_SHOP_SLACK_BOT_TOKEN:-}
      # Optional. Same app's signing secret: enables link buttons and the
      # signed /api/slack/interactions acknowledgement. hawk-mod reads the
      # unprefixed SLACK_SIGNING_SECRET, so this one must stay prefixed.
      SLACK_SIGNING_SECRET: ${HAWK_SHOP_SLACK_SIGNING_SECRET:-}

      # --- Deployment ------------------------------------------------------
      # Public origin; Shop accepts writes only from this origin.
      APP_URL: ${APP_URL:-https://shop.${DOMAIN}}

      # --- Storage ---------------------------------------------------------
      # SQLite database + uploaded images, both under here.
      DATA_DIR: /data
    volumes:
      - hawk_shop_data:/data
    # The image carries its own HEALTHCHECK against /api/health.

  hawk-mod:
    networks: [mod]
    image: ${HAWK_MOD_IMAGE:-ghcr.io/frc2713/hawk-mod:${HAWK_MOD_TAG:-latest}}
    restart: unless-stopped
    environment:
      # --- Slack app credentials (required) --------------------------------
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_STATE_SECRET: ${SLACK_STATE_SECRET:-}

      # --- Deployment ------------------------------------------------------
      # Slack posts events here from its own servers, so this has to be the
      # real public HTTPS hostname and match the app manifest exactly.
      PUBLIC_URL: ${PUBLIC_URL:-https://mod.${DOMAIN}}
      PORT: 3000
      # Private findings channel — the C… ID, not the name.
      ALERT_CHANNEL_ID: ${ALERT_CHANNEL_ID:-}

      # --- Storage ---------------------------------------------------------
      DATA_DIR: /data
      # Encrypts adult Slack tokens at rest. Not recoverable: losing it means
      # every adult re-authorizes, leaking it means the volume alone can read
      # their DMs.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # full = store message text of monitored DMs; metadata = who/when only.
      LOG_MODE: ${LOG_MODE:-full}

      # --- Roles -----------------------------------------------------------
      # Slack user groups that declare who is a student and who is an adult.
      # Roles come from the lifecycle sheet; these are groups admins may edit.
      MANAGED_USERGROUPS: ${MANAGED_USERGROUPS:-}

      # --- Lifecycle sync (optional) ---------------------------------------
      # Reads the RHR User Lifecycle Management DB sheet. Its own service
      # account, not hawk-bot's: this one can read every student's row, so
      # the two keys are separate secrets and CI checks they never cross.
      # Unset, hawk-mod runs exactly as before. See hawk-mod's
      # docs/google-setup.md.
      GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${HAWK_MOD_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64:-}
      LIFECYCLE_SHEET_ID: ${LIFECYCLE_SHEET_ID:-}

      # --- Schedules -------------------------------------------------------
      TZ: ${TZ:-America/New_York}
      SWEEP_CRON: ${SWEEP_CRON:-0 3 * * *}
      BACKFILL_CRON: ${BACKFILL_CRON:-15 * * * *}
      REPORT_TIME: ${REPORT_TIME:-}
    volumes:
      # Parental-consent records and, at LOG_MODE=full, minors' message text.
      # Back it up; read the data-handling notes in docs/deploy-linode.md.
      - hawk_mod_data:/data
    # The image carries its own HEALTHCHECK against /health.

  hawk-bot:
    networks: [bot]
    image: ${HAWK_BOT_IMAGE:-ghcr.io/frc2713/hawk-bot:${HAWK_BOT_TAG:-latest}}
    restart: unless-stopped
    environment:
      # --- Slack app credentials (required) --------------------------------
      # A SECOND Slack app, separate from hawk-mod's. Same workspace, its own
      # credentials and its own install. The variables are prefixed here
      # because both apps read the unprefixed names inside their containers,
      # and one .env holds both.
      SLACK_SIGNING_SECRET: ${HAWK_BOT_SLACK_SIGNING_SECRET:-}
      SLACK_CLIENT_ID: ${HAWK_BOT_SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${HAWK_BOT_SLACK_CLIENT_SECRET:-}
      SLACK_STATE_SECRET: ${HAWK_BOT_SLACK_STATE_SECRET:-}

      # --- Deployment ------------------------------------------------------
      # Slack posts slash commands and events here from its own servers, so
      # this has to be the real public HTTPS hostname and match the app
      # manifest exactly.
      PUBLIC_URL: ${HAWK_BOT_PUBLIC_URL:-https://bot.${DOMAIN}}
      PORT: 3000

      # --- Google Calendar (required) ---------------------------------------
      # A Google Cloud service account's JSON key, base64'd onto one line —
      # read-only access to whichever calendars are shared with it. Required:
      # hawk-bot's config schema has no default for this and the container
      # will not boot without it. Which calendars it actually reads
      # (team_meeting_calendar_id and the optional informational_calendar_id /
      # mentor_calendar_id) are Slack workspace settings, not here — see
      # hawk-bot's domain/settings.ts. Holding the credential is not the same
      # as having access: the Calendar API has to be enabled in the account's
      # Cloud project and each calendar shared with the account's own address.
      # See .env.example, and `/hawkbot calendar` to test it from Slack.
      GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: ${HAWK_BOT_GOOGLE_SERVICE_ACCOUNT_KEY_BASE64:-}

      # --- Storage ---------------------------------------------------------
      DATA_DIR: /data
      # Encrypts the stored workspace installation, which carries the bot
      # token. Unlike hawk-mod's key of the same name, losing this one costs
      # a single reinstall by an admin — no per-person data depends on it.
      TOKEN_ENCRYPTION_KEY: ${HAWK_BOT_TOKEN_ENCRYPTION_KEY:-}

      TZ: ${TZ:-America/New_York}
    volumes:
      # The workspace installation and a small settings table. Recreatable by
      # reinstalling; back it up for convenience, not for obligation.
      - hawk_bot_data:/data
    # The image carries its own HEALTHCHECK against /health.

  hawk-eye:
    networks: [eye]
    image: ${HAWK_EYE_IMAGE:-ghcr.io/frc2713/hawk-eye:${HAWK_EYE_TAG:-sha-535855c59b2d1f290c899ba1c834bdcc3d6db86e}}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      APP_URL: ${HAWK_EYE_APP_URL:-https://scout.${DOMAIN}}
      LOG_LEVEL: ${HAWK_EYE_LOG_LEVEL:-info}
      TBA_API_KEY: ${HAWK_EYE_TBA_API_KEY:-}
      MATCH13_API_KEY: ${HAWK_EYE_MATCH13_API_KEY:-}
      MATCH13_ACCOUNT: ${HAWK_EYE_MATCH13_ACCOUNT:-default}
    volumes:
      - hawk_eye_data:/data
    # The image carries its own HEALTHCHECK against /health.

volumes:
  caddy_data:
  caddy_config:
  hawk_shop_data:
  hawk_mod_data:
  hawk_bot_data:
  hawk_eye_data:

# Each backend shares a network only with Caddy; outbound API access remains enabled.
networks:
  shop: {}
  mod: {}
  bot: {}
  eye: {}
