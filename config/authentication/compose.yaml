# Added by the reviewed deploy path only when the release includes authentication.
services:
  caddy:
    image: ${HAWK_AUTH_IMAGE:?Pin the tested authentication image in the release}
    environment:
      CADDY_CONFIG_REV: auth-shop-identity-headers-v7
    volumes:
      - ${HAWK_AUTH_CONFIG_DIR:?Private release configuration}:/etc/hawk-auth:ro
      - ${HAWK_AUTH_CONFIG_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HAWK_AUTH_ASSET_DIR:?Reviewed branding assets}:/srv/auth-assets:ro
    logging:
      driver: none
  # Trust the gateway only on each app's isolated Caddy network. The issuer
  # supplies portal/logout URLs; team ID must match the authenticated workspace.
  hawk-eye:
    environment:
      HAWK_SUITE_ISSUER: https://apps.${DOMAIN}/
      HAWK_SUITE_TRUST_PROXY: "true"
      HAWK_SUITE_TEAM_ID: ${HAWK_AUTH_SLACK_TEAM_ID:?Verified gateway workspace}
  hawk-mod:
    environment:
      HAWK_SUITE_ISSUER: https://apps.${DOMAIN}/
      HAWK_SUITE_TRUST_PROXY: "true"
      HAWK_SUITE_TEAM_ID: ${HAWK_AUTH_SLACK_TEAM_ID:?Verified gateway workspace}
  hawk-bot:
    environment:
      HAWK_SUITE_ISSUER: https://apps.${DOMAIN}/
      HAWK_SUITE_TRUST_PROXY: "true"
      HAWK_SUITE_TEAM_ID: ${HAWK_AUTH_SLACK_TEAM_ID:?Verified gateway workspace}
  hawk-shop:
    environment:
      HAWK_SUITE_ISSUER: https://apps.${DOMAIN}/
      HAWK_SUITE_TRUST_PROXY: "true"
      HAWK_SUITE_TEAM_ID: ${HAWK_AUTH_SLACK_TEAM_ID:?Verified gateway workspace}
